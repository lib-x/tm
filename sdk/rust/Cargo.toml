[package]
name = "tunnel-mux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transport-independent TMP v1 multiplexing core"
repository = "https://github.com/lib-x/tm"
readme = "README.md"
keywords = ["multiplexing", "tunnel", "protocol", "protobuf", "networking"]
categories = ["network-programming"]

[dependencies]
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
